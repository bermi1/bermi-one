project_id = "uqmzbhymqgcwselvzabg"

[functions.admin]
# The Bermi Techs console's elevated operations. Runs with the service role, so
# the caller's JWT is what proves they are staff — verification stays on, and
# the function checks is_platform_admin() before it touches anything.
verify_jwt = true

[functions.payme-webhook]
# Payme Africa has no Supabase session. Its callbacks are authenticated by the
# X-Middleware-Signature HMAC instead, which the function checks before it
# reads a single field. Leaving JWT verification on rejects every real callback.
verify_jwt = false

[functions.notify]
# Called by a schedule, which has no user session either. Protected by a shared
# NOTIFY_WORKER_KEY header rather than a JWT.
verify_jwt = false
